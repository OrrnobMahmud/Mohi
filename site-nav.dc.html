<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:relative;z-index:10;width:100%;max-width:1280px;margin:0 auto;padding:20px clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:16px 28px;flex-wrap:wrap;box-sizing:border-box;font-family:'Manrope',sans-serif;">
  <a href="home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;">
    <img src="https://digitalmusker.com/wp-content/uploads/2025/12/Logo-White.svg" alt="Digital Musker" style="height:30px;width:auto;display:block;">
  </a>
  <nav style="display:flex;align-items:center;gap:6px 26px;flex-wrap:wrap;">
    <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
      <a href="{{ link.href }}" style="position:relative;color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:6px 0;display:flex;align-items:center;gap:6px;" style-hover="opacity:.75;">
        <sc-if value="{{ link.active }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:50%;background:#F7D64A;display:block;"></span></sc-if>
        {{ link.label }}
      </a>
    </sc-for>
  </nav>
  <a href="contact.dc.html" style="display:flex;align-items:center;gap:8px;background:#fff;color:#111214;text-decoration:none;font-size:13px;font-weight:700;padding:11px 18px;border-radius:6px;letter-spacing:.02em;" style-hover="background:#F7D64A;">Free consultation <span>→</span></a>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;services&quot;,&quot;portfolio&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? '';
    const links = [
      ['home', 'Home', 'home.dc.html'],
      ['about', 'About', 'about.dc.html'],
      ['services', 'Services', 'services.dc.html'],
      ['portfolio', 'Portfolio', 'portfolio.dc.html'],
      ['contact', 'Contact', 'contact.dc.html'],
    ].map(([k, label, href]) => ({ label, href, active: k === a }));
    return { links };
  }
}
</script>
</body>
</html>
