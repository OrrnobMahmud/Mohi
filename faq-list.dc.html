<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:12px;font-family:'Manrope',sans-serif;width:100%;">
  <sc-for list="{{ rows }}" as="row" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;">
      <sc-if value="{{ row.open }}" hint-placeholder-val="{{ false }}">
        <div style="background:#fff;border:2px solid #2B6BF3;border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;">
          <button onClick="{{ row.toggle }}" style="all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;">
            <span style="font-size:17px;font-weight:700;color:#111214;line-height:1.35;text-wrap:pretty;">{{ row.q }}</span>
            <span style="flex:none;width:28px;height:28px;border-radius:6px;background:#2B6BF3;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;">−</span>
          </button>
          <p style="margin:0;font-size:15px;line-height:1.6;color:#4A4842;text-wrap:pretty;">{{ row.a }}</p>
        </div>
      </sc-if>
      <sc-if value="{{ row.closed }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ row.toggle }}" style="all:unset;cursor:pointer;background:#fff;border-radius:10px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;" style-hover="box-shadow:0 0 0 2px #2B6BF3 inset;">
          <span style="font-size:17px;font-weight:700;color:#111214;line-height:1.35;text-wrap:pretty;">{{ row.q }}</span>
          <span style="flex:none;width:28px;height:28px;border-radius:6px;background:#F2EFE8;color:#111214;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;">+</span>
        </button>
      </sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:420},&quot;items&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[{&quot;q&quot;:&quot;Question?&quot;,&quot;a&quot;:&quot;Answer.&quot;}],&quot;tsType&quot;:&quot;{q:string,a:string}[]&quot;},&quot;allowMultiple&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: [0] };
  toggle(i) {
    const multi = this.props.allowMultiple ?? false;
    this.setState(s => {
      const has = s.open.includes(i);
      if (multi) return { open: has ? s.open.filter(x => x !== i) : [...s.open, i] };
      return { open: has ? [] : [i] };
    });
  }
  renderVals() {
    const items = this.props.items ?? [];
    return {
      rows: items.map((it, i) => {
        const open = this.state.open.includes(i);
        return { q: it.q, a: it.a, open, closed: !open, toggle: () => this.toggle(i) };
      })
    };
  }
}
</script>
</body>
</html>
